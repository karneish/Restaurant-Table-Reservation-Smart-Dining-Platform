name: ticket-booking-system

services:
  # ─── PostgreSQL 18 (primary database) ─────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: ticket-booking-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ticket_booking_system_db
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: root123
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_booking_system_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── pgAdmin4 (database management UI) ────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ticket-booking-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ticketbooking.com
      PGADMIN_DEFAULT_PASSWORD: root123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./config/pgadmin-servers.json:/pgadmin4/servers.json
      - ./config/pgpass:/tmp/pgpassfile:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticket-network

  # ─── Service Registry (Eureka) ────────────────────────────────────
  service-registry:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: service-registry
        PORT: 8761
    container_name: ticket-booking-registry
    ports:
      - "8761:8761"
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ─── Config Server ────────────────────────────────────────────────
  config-server:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: config-server
        PORT: 8888
    container_name: ticket-booking-config
    ports:
      - "8888:8888"
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ─── API Gateway (main entry point) ───────────────────────────────
  ticket-booking:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: api-gateway
        PORT: 8080
    container_name: ticket-booking-gateway
    ports:
      - "8080:8080"
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_started
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - AUTH_SERVICE_URL=http://auth-service:8081
      - USER_SERVICE_URL=http://user-service:8082
      - RESTAURANT_SERVICE_URL=http://restaurant-service:8083
      - TABLE_SERVICE_URL=http://table-service:8084
      - SLOT_SERVICE_URL=http://slot-service:8085
      - RESERVATION_SERVICE_URL=http://reservation-service:8086
      - PAYMENT_SERVICE_URL=http://payment-service:8087
      - NOTIFICATION_SERVICE_URL=http://notification-service:8088

  # ─── Auth Service ─────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: auth-service
        PORT: 8081
    container_name: ticket-booking-auth
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - ticket-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ticket_booking_system_db
      - SPRING_DATASOURCE_USERNAME=ticket_user
      - SPRING_DATASOURCE_PASSWORD=root123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ─── User Service ─────────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: user-service
        PORT: 8082
    container_name: ticket-booking-user
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - ticket-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ticket_booking_system_db
      - SPRING_DATASOURCE_USERNAME=ticket_user
      - SPRING_DATASOURCE_PASSWORD=root123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ─── Restaurant Service ───────────────────────────────────────────
  restaurant-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: restaurant-service
        PORT: 8083
    container_name: ticket-booking-restaurant
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - ticket-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ticket_booking_system_db
      - SPRING_DATASOURCE_USERNAME=ticket_user
      - SPRING_DATASOURCE_PASSWORD=root123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ─── Table Service ────────────────────────────────────────────────
  table-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: table-service
        PORT: 8084
    container_name: ticket-booking-table
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - ticket-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ticket_booking_system_db
      - SPRING_DATASOURCE_USERNAME=ticket_user
      - SPRING_DATASOURCE_PASSWORD=root123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ─── Slot Service ─────────────────────────────────────────────────
  slot-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: slot-service
        PORT: 8085
    container_name: ticket-booking-slot
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - ticket-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ticket_booking_system_db
      - SPRING_DATASOURCE_USERNAME=ticket_user
      - SPRING_DATASOURCE_PASSWORD=root123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - TABLE_SERVICE_URL=http://table-service:8084

  # ─── Reservation Service ──────────────────────────────────────────
  reservation-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: reservation-service
        PORT: 8086
    container_name: ticket-booking-reservation
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - ticket-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ticket_booking_system_db
      - SPRING_DATASOURCE_USERNAME=ticket_user
      - SPRING_DATASOURCE_PASSWORD=root123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - TABLE_SERVICE_URL=http://table-service:8084
      - SLOT_SERVICE_URL=http://slot-service:8085
      - RESTAURANT_SERVICE_URL=http://restaurant-service:8083

  # ─── Payment Service ──────────────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: payment-service
        PORT: 8087
    container_name: ticket-booking-payment
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - ticket-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ticket_booking_system_db
      - SPRING_DATASOURCE_USERNAME=ticket_user
      - SPRING_DATASOURCE_PASSWORD=root123
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ─── Notification Service ─────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MODULE: notification-service
        PORT: 8088
    container_name: ticket-booking-notification
    ports:
      - "8088:8088"
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - ticket-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # ─── Frontend (React, served by Nginx) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket-booking-frontend
    ports:
      - "3000:80"
    depends_on:
      - ticket-booking
    networks:
      - ticket-network

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ticket-network:
    driver: bridge
