server:
  port: ${PORT:8888}

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/your-org/ticket-booking-config
          default-label: main
          skipSslValidation: true
        native:
          searchLocations: classpath:/config-repo
    compatibility-verifier:
      enabled: false

  profiles:
    active: native

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh
