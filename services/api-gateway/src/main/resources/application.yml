server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 30000
        response-timeout: 120s
      routes:
        - id: table-service-areas
          uri: ${TABLE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/restaurants/*/areas
          order: -10
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**
        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/restaurants/**
        - id: table-service
          uri: ${TABLE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/areas/**,/api/tables/**
        - id: slot-service
          uri: ${SLOT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/slots/**
        - id: reservation-service
          uri: ${RESERVATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/reservations/**,/api/preorders/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/notifications/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
            allowedMethods: ["GET","POST","PUT","DELETE","PATCH","OPTIONS"]
            allowedHeaders: ["*"]
            exposedHeaders: ["Authorization"]

eureka:
  client:
    enabled: false
    registerWithEureka: false
    fetchRegistry: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIHRpY2tldCBib29raW5nIHN5c3RlbSB3aXRoIFNwcmluZyBCb290IGFuZCBKV1Q=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
