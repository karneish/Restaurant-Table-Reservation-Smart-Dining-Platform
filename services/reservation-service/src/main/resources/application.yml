server:
  port: ${PORT:8086}
spring:
  application:
    name: reservation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-weathered-scene-azd9bah0-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 120000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
eureka:
  client:
    enabled: false
    registerWithEureka: false
    fetchRegistry: false

service:
  urls:
    restaurant: ${RESTAURANT_SERVICE_URL:http://localhost:8083}
    table: ${TABLE_SERVICE_URL:http://localhost:8084}
    slot: ${SLOT_SERVICE_URL:http://localhost:8085}
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8087}
    notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
    user: ${USER_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
